<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <title>GraphRAG Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        #chat-container {
            width: 60%;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        #messages {
            height: 420px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            background: #fafafa;
            white-space: normal; 
        }

        .user-message, .bot-message {
            margin-bottom: 14px;
            line-height: 1.45em;
            word-wrap: break-word;
        }

        .sender {
            font-weight: bold;
            margin-right: 6px;
            display: inline;
        }

        #input-area {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }


        #user-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .inline-loader {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-style: italic;
            color: #777;
            font-size: 14px;
            vertical-align: middle;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.4s infinite both;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }

        .bot-text {
            margin-top: 8px;
            color: #111;
        }

        @media (max-width: 900px) {
            #chat-container { width: 90%; }
        }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>Erica - The AI Tutor</h2>

    <div id="messages"></div>

    <div id="input-area">
        <input id="user-input" type="text" placeholder="Ask something…" />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>


<script>
async function sendMessage() {
    const input = document.getElementById("user-input");
    const userText = input.value.trim();
    if (!userText) return;

    const messages = document.getElementById("messages");

    messages.insertAdjacentHTML(
        "beforeend",
        `<div class="user-message"><span class="sender">You:</span> ${escapeHtml(userText)}</div>`
    );
    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    const botContainer = document.createElement("div");
    botContainer.className = "bot-message";
    botContainer.innerHTML =
        '<span class="sender">Erica:</span> ' +
        '<span class="inline-loader" id="active-loader">' +
            '<span>typing… (responses take about a minute)</span>' +
            '<span class="typing-dots"><span></span><span></span><span></span></span>' +
        '</span>' +
        '<div class="bot-text" id="bot-text" style="display:none;"></div>';

    messages.appendChild(botContainer);

    messages.scrollTop = messages.scrollHeight;

    const loaderSpan = botContainer.querySelector("#active-loader");
    const botTextDiv = botContainer.querySelector("#bot-text");

    try {
        const resp = await fetch("http://localhost:8088/query", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ query: userText })
        });

        if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
        }

        const data = await resp.json();

        console.log("FULL RAG RESULT:", data);

        loaderSpan.style.display = "none";

        const html = marked.parse(typeof data.answer === "string" ? data.answer : String(data.answer));
        botTextDiv.style.display = "block";
        botTextDiv.innerHTML = html;

    } catch (err) {
        loaderSpan.style.display = "none";
        botTextDiv.style.display = "block";
        botTextDiv.innerHTML = `<div style="color:red;"><strong>Error:</strong> ${escapeHtml(String(err))}</div>`;
    }

    messages.scrollTop = messages.scrollHeight;
}

function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
